services:
    db:
      image: postgres:16
      restart: unless-stopped
      env_file: .env
      ports:
        - "5433:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      networks:
        - app-net
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 10

    backend:
      build: .
      restart: unless-stopped
      env_file: .env
      ports:
        - "8000:8000"
      volumes:
        - ./alembic/versions:/app/alembic/versions
      depends_on:
        db:
          condition: service_healthy
      networks:
        - app-net

volumes:
  pgdata:

networks:
  app-net: